<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AssetCues Portal — team workspace, tasks, and knowledge assistant." />
    <title>AssetCues Portal</title>
    <script>
      try {
        var theme = localStorage.getItem("assetcues:theme") || "light";
        var dark = theme === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", !dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (document.body) {
          document.body.classList.toggle("dark", dark);
          document.body.classList.toggle("light", !dark);
          document.body.dataset.theme = dark ? "dark" : "light";
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-portal-bg font-sans text-portal-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
