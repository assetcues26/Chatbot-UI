# Mirror of netlify.toml for humans. Netlify itself reads netlify.toml, not this file.
build:
  command: npm run build
  publish: dist
  environment:
    NODE_VERSION: "20"
    VITE_API_URL: "https://chatbot-backend-h6oj.onrender.com"

redirects:
  - from: /docs
    to: https://chatbot-backend-h6oj.onrender.com/docs
    status: 200
    force: true
  - from: /docs/*
    to: https://chatbot-backend-h6oj.onrender.com/docs/:splat
    status: 200
    force: true
  - from: /redoc
    to: https://chatbot-backend-h6oj.onrender.com/redoc
    status: 200
    force: true
  - from: /openapi.json
    to: https://chatbot-backend-h6oj.onrender.com/openapi.json
    status: 200
    force: true
  - from: "/*"
    to: /index.html
    status: 200
